[project]
name = "pecans"
version = "1.68.0"
description = "Two Cans & String SDK, generated from the pecans TypeSpec."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pecans"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
